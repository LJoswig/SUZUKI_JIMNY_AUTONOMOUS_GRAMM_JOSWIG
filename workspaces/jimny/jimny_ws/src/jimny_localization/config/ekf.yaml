# Dual EKF setup (REP-105), see robot_localization dual_ekf_navsat example.
#   ekf_local  : odom -> base_link. Continuous sources only, never jumps. Used by local consumers
#                (centerline_follower later, local costmap).
#   ekf_global : map -> odom. Same inputs + GPS (via navsat_transform). Absolute, may jump.
#
# *_config order: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
# base_link = rear axle (same reference point as centerline_follower / PlanarOdometry).

ekf_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # GPS Doppler speed (vx) + nonholonomic vy = 0, from speed_twist
    twist0: /speed/twist
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,
                    false, false, false,
                    false, false, false]
    twist0_queue_size: 10

    # Yaw rate only. The Cube's absolute yaw is not fused here, so an EKF3 heading reset on the
    # Cube cannot rotate the odom frame under the follower's path.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 20

ekf_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    twist0: /speed/twist
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,
                    false, false, false,
                    false, false, false]
    twist0_queue_size: 10

    # Absolute yaw (ENU, from Cube EKF3, variance 15 deg) + yaw rate. Absolute yaw anchors the map
    # frame heading; set the yaw entry to false if the Cube heading proves unreliable in the car.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 20

    # GPS position from navsat_transform_node
    odom0: /odometry/gps
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10
    # Reject GPS jumps beyond ~3 sigma (Mahalanobis distance)
    odom0_rejection_threshold: 3.0
